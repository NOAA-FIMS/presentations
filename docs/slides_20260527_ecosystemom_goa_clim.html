FIMS is a flexible suite of software tools to support sustainable fishery management

---

# Why are We Building {ecosystemom}?

- 🏗️️ Create a flexible ecosystem-to-stock-assessment simulation framework

- 🧪 Test FIMS using ecosystem models as operating models

- 🔍 Explore ecosystem-informed stock assessment approaches

- 🤝 Create interdisciplinary research and collaboration opportunities

---
# Features

Import and standardize outputs from ecosystem operating models

- `load_model()`

- Current and planned ecosystem modeling platform support

  - Ecopath with Ecosim (EwE): 🧪 Ecosim, 🚧️ Ecospace, 🚧 Individual-based version of Ecospace
  
  - 🔎 Atlantis

# Features
Extract “true” population quantities from OMs, including annual or monthly trajectories and age compositions

- `calc_truth()`

---

---
# Features
Generate sampled observations from OM outputs for use in fisheries stock assessment models such as FIMS

- `sample_lognormal()`
- `sample_multinomial()`
- `sample_dirichlet_multinomial()`

---

---
# Features
Reshape environmental or diet composition data from OMs to support time series analyses such as Dynamic Structural Equation Models (DSEMs)

- `create_dsem_inputs()`

# Main Challenges
Different ecosystem models 

- produce different output formats
- has different spatial and temporal structures
- use different assumptions and parameterizations
