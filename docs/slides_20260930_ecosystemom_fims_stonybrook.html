# Why was Fisheries Integrated Modeling System (FIMS) Created


&lt;ul&gt; &lt;li&gt;FIMS was created, according to its Terms of Reference, to increase the pool of developers, designers, and testers that contribute to a commonly-used stock assessment modeling system that can be used across regions.&lt;/li&gt;&lt;br&gt;&lt;li&gt;The commitment to build FIMS was made by the National Marine Fisheries Service (NMFS) Science Board in 2020 partly in response to the Center for the Advancement of Population Assessment Methodology (CAPAM) workshop on Next Generation Models and the recommendations in Implementing a Next Generation Stock Assessment Enterprise, a NOAA Fisheries strategic document that calls for the development of general modeling platforms that facilitate ease of use, robust testing, modular applications, and best practices and to improve the professionalism of model development.&lt;/li&gt;&lt;br&gt; &lt;/ul&gt;

# Single-Species Advice in Dynamic Ecosystems

- Single-species assessments remain central to tactical fisheries-management advice worldwide
- Current testing frameworks often suggest robust performance when using single-species operating models (OMs)
- Real-world fish stocks inhabit dynamic oceans driven by environmental forcing and changing trophic interactions
- The key gap is integration, i.e., connecting ecosystem models to tactical stock assessment tools

# End-to-End Simulation Case Study

- Ecosystem: Northwest Atlantic EwE Ecosim model (Adapted from Chagaris et al., 2020)

- Focal stock: Atlantic menhaden-like species &lt;img src="https://www.fisheries.noaa.gov/s3/styles/original/s3/2021-01/640x427-Atlantic_Menhaden_NB_W.jpg?itok=QBXXGzDD" alt="Image of Atlantic menhaden fish" width = "100"&gt;

--

- OM scenarios:
  - Scenario 1 (S1): base scenario without environmental forcing
  - Scenario 2 (S2): environmental forcing scenario
  
--

- EM scenarios:
  - FIMS without young-of-the-year (YOY) survey
  - FIMS with young-of-the-year (YOY) survey

.hyperlink-style[[Chagaris, D., Drew, K., Schueller, A., Cieri, M., Brito, J., and Buchheister, A. 2020. Ecological reference points for Atlantic menhaden established using &lt;br&gt; an ecosystem model of intermediate complexity. Frontiers in Marine Science, 7:606417. 10.3389/fmars.2020.606417.](https://doi.org/10.3389/fmars.2020.606417)]&lt;br&gt;

# Lessons Learned #1: Sample Size vs. Survey Types

- Increasing age composition sample size did not fix non-convergence in the EM

- Simulating a dedicated young-of-the-year (YOY) survey index improved model fits and recruitment tracking

.pull-left[
&lt;img src="static/ecosystemom_atlantic_menhaden_recruitment_without_yoy.png" width="80%" style="display: block; margin: auto;" /&gt;
]

.pull-right[
&lt;img src="static/ecosystemom_atlantic_menhaden_recruitment_with_yoy.png" width="80%" style="display: block; margin: auto;" /&gt;
]

--

💡 **{ecosystemom} provides a testbed to evaluate alternative survey designs**

---
# Lessons Learned #2: Perfectly Known Natural Mortality

- Passing the "true" time-varying and age-varying natural mortality (M) matrix from the OM (S1) yielded matching estimates

- Assuming perfectly known time-varying M is not applicable to real-world assessments

.pull-left[
&lt;img src="static/ecosystemom_atlantic_menhaden_biomass_comparison.png" width="80%" style="display: block; margin: auto;" /&gt;
]

.pull-right[
&lt;img src="static/ecosystemom_atlantic_menhaden_fishing_mortality_comparison.png" width="80%" style="display: block; margin: auto;" /&gt;
]

--

💡 **{ecosystemom} provides a testbed to explore parameter and process misspecifications**

---
# Lessons Learned #3: Incorporating Environmental Drivers

- 🚧 Implementing dynamic structural equation model (DSEM) in FIMS is currently a work in progress 🚧

- Active environmental forcing (S2) in the OM creates challenges with parameter estimation when the EM cannot fit to the environmental driver

# Summary

🎉 **FIMS successfully recovers "true" focal stock dynamics from Ecosim OMs** 🎉

✅️ Extract "true" underlying biomass, age structures, fishing mortality, and time-varying natural mortality using `get_truth()` for comparisons

✅️ Simulate realistic fleets and generate required data for FIMS using `sample_*()`

✅️ Automatically map Ecosim outputs into starting parameters for seamless setup
